<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>遊び · Minijuegos de japonés</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f1e3;--card:#fffaf0;--ink:#2b2220;--red:#c1272d;--mut:#7a6a5f;--ok:#2e7d4f;--bad:#b3261e;--line:#e3d6bd;--blue:#2a5d8f;--sh:#2b22201f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1716;--card:#2a2120;--ink:#f3e9d8;--mut:#b5a595;--line:#43352f;--red:#e0545a;--blue:#7fb2e5;--sh:#0008}}
:root[data-theme="dark"]{--bg:#1d1716;--card:#2a2120;--ink:#f3e9d8;--mut:#b5a595;--line:#43352f;--red:#e0545a;--blue:#7fb2e5;--sh:#0008}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;background-image:radial-gradient(circle at 100% 100%,transparent 55%,var(--line) 56%,var(--line) 58%,transparent 59%),radial-gradient(circle at 0 100%,transparent 55%,var(--line) 56%,var(--line) 58%,transparent 59%);background-size:44px 22px;background-attachment:fixed}
header{text-align:center;padding:30px 16px 6px}
.sun{width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ef5b5f,var(--red));margin:0 auto 10px;display:grid;place-items:center;color:#fff;font-size:36px;font-weight:700;box-shadow:0 6px 18px #c1272d55;animation:fl 4s ease-in-out infinite;cursor:pointer}
@keyframes fl{50%{transform:translateY(-5px)}}
h1{margin:0;font-size:1.9rem;letter-spacing:.15em}header p{margin:4px 0 8px;color:var(--mut)}
h2{margin:6px 0}.sec{text-align:center;letter-spacing:.1em;margin:18px 0 6px}
.stats,.row,.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.85rem;box-shadow:0 2px 6px var(--sh)}
button{font:inherit;color:inherit;cursor:pointer}
.f{border:1.5px solid var(--red);background:var(--card);color:var(--red);padding:7px 14px;border-radius:999px;transition:.15s}
.f:hover{transform:translateY(-2px)}.f.on{background:var(--red);color:#fff}
.act{border:0;background:linear-gradient(135deg,#d93a40,#a81e24);color:#fff;padding:11px 22px;border-radius:12px;font-weight:700;box-shadow:0 4px 12px #c1272d44}
.act:hover:not(:disabled){filter:brightness(1.1)}.act:disabled{opacity:.45;cursor:not-allowed}
.act.alt{background:linear-gradient(135deg,#2a5d8f,#1c3f66);box-shadow:0 4px 12px #2a5d8f44}
#app{max-width:960px;margin:0 auto;padding:6px 14px 50px}
.cnt{text-align:center;color:var(--mut);font-size:.9rem;margin:4px 0}
.jp{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--blue);color:var(--blue);border-radius:999px;padding:1px 8px;font-style:normal}
.lb{font-size:.7rem;color:var(--red);font-weight:700;letter-spacing:.08em;margin:14px 0 6px;text-align:center}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:10px}
.g{--cc:var(--red);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:22px 16px;background:linear-gradient(180deg,color-mix(in srgb,var(--cc) 12%,var(--card)),var(--card) 55%);border:1px solid var(--line);border-top:5px solid var(--cc);border-radius:14px;box-shadow:0 6px 16px var(--sh);transition:.2s}
.g:hover:not(:disabled){transform:translateY(-5px) rotate(-.4deg)}.g b{font-size:1.3rem;letter-spacing:.06em}.g small{color:var(--mut);font-size:.9rem;line-height:1.35}
.g.soon{opacity:.55;cursor:default;border-style:dashed}
.gi{font-size:2.6rem;width:84px;height:84px;display:grid;place-items:center;border-radius:50%;background:color-mix(in srgb,var(--cc) 18%,var(--card));box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--cc) 40%,transparent)}
.panel{max-width:600px;margin:14px auto;padding:22px 16px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px var(--sh)}
.em{--cc:var(--red);font-size:3.4rem;width:96px;height:96px;display:grid;place-items:center;border-radius:50%;background:color-mix(in srgb,var(--cc) 18%,var(--card));box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--cc) 40%,transparent);margin:0 auto 6px}
.em.big{font-size:4.6rem;width:128px;height:128px}
.jbig{font-size:3.4rem;line-height:1.25;color:var(--red);margin:6px 0}
.pr{font-size:1.7rem;margin:10px 0}
.hud{display:flex;justify-content:space-between;gap:8px;font-weight:700;margin-bottom:8px}
.tb{height:9px;border-radius:9px;background:var(--line);overflow:hidden;margin-bottom:10px}
.tb i{display:block;height:100%;width:100%;background:var(--ok);transition:width .1s linear}
.tb i.lo{background:var(--bad)}
.og{display:grid;gap:8px;margin:10px 0}.og.ic{grid-template-columns:1fr 1fr}
.o{display:block;width:100%;padding:11px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:1.15rem;transition:.15s}
.o small{display:block;font-size:.72rem;opacity:.7}
.o.i{font-size:3.2rem;line-height:1.1;padding:12px 0}
.o:hover:not(:disabled){border-color:var(--red);transform:scale(1.02)}
.o.ok{background:var(--ok);color:#fff;border-color:var(--ok);animation:pop .4s}.o.bad{background:var(--bad);color:#fff;border-color:var(--bad);animation:sk .35s}
@keyframes pop{50%{transform:scale(1.07)}}@keyframes sk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.msg{min-height:34px;font-weight:700;margin:6px 0}.msg small{font-weight:400;color:var(--mut)}
.sp{border:0;background:transparent;font-size:1.2rem;line-height:1}
.sp.big{font-size:3rem;width:110px;height:110px;border-radius:50%;background:color-mix(in srgb,var(--blue) 15%,var(--card));box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--blue) 40%,transparent)}
.note{color:var(--mut);font-size:.85rem;min-height:20px;margin:8px 0}
.cats .f{--cc:var(--red);border-color:var(--cc);color:var(--cc);font-size:.85rem;padding:5px 11px}.cats .f.on{background:var(--cc);color:#fff}
.ml{text-align:left;max-height:190px;overflow:auto;margin:10px 0;border-top:1px solid var(--line)}
.ml div{padding:5px 4px;border-bottom:1px solid var(--line);font-size:.95rem}
.mg{display:grid;gap:8px;margin:10px 0}
.mc{perspective:700px;aspect-ratio:3/4;cursor:pointer}
.in{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.mc.fl .in{transform:rotateY(180deg)}
.s{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);border-radius:10px;box-shadow:0 3px 8px var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px;overflow:hidden;line-height:1.15}
.mf{background:linear-gradient(135deg,#d93a40,#a81e24);color:#fff;font-size:1.8rem;border-top:4px solid #f4b942}
.mb{background:var(--card);transform:rotateY(180deg);font-size:.85rem}
.mc.ok .mb{background:color-mix(in srgb,var(--ok) 25%,var(--card));border-color:var(--ok)}.mc.ok{animation:pop .5s}
.mce{font-size:2.3rem}.mcj{font-size:1.2rem}.mb small{font-size:.65rem;color:var(--mut)}
[hidden]{display:none!important}
</style></head><body>

const M={};"あa いi うu えe おo かka きki くku けke こko さsa しshi すsu せse そso たta ちchi つtsu てte とto なna にni ぬnu ねne のno はha ひhi ふfu へhe ほho まma みmi むmu めme もmo やya ゆyu よyo らra りri るru れre ろro わwa をo んn がga ぎgi ぐgu げge ごgo ざza じji ずzu ぜze ぞzo だda ぢji づzu でde どdo ばba びbi ぶbu べbe ぼbo ぱpa ぴpi ぷpu ぺpe ぽpo".replace(/(\S)([a-z]+)/g,(_,k,r)=>M[k]=r);
function ro(s){s=s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));let o="",d=0;const V={ゃ:"ya",ゅ:"yu",ょ:"yo",ぁ:"a",ぃ:"i",ぅ:"u",ぇ:"e",ぉ:"o"};for(let i=0;i<s.length;i++){const c=s[i];if(c=="っ"){d=1;continue}if(c=="ー"){o+=o.slice(-1);continue}let r=M[c];if(r==null){o+=c;continue}const n=s[i+1];if(n&&V[n]){const v=V[n];r=/^(sh|ch|j)i$/.test(r)&&"ゃゅょ".includes(n)?r.slice(0,-1)+v.slice(1):r.slice(0,-1)+v;i++}if(d){r=r[0]=="c"?"t"+r:r[0]+r;d=0}o+=r}return o}
const say=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";u.rate=.85;speechSynthesis.speak(u)}catch(e){}};
const SPEECH="speechSynthesis" in window;
/* ── Ajustes de partida ── */
const C={mode:"mix",rule:"clasico",esc:"todo",timer:false,hint:true,ro:true,voice:false,cats:Object.keys(CT),pairs:8,ptype:"ie"};
const isK=c=>/^[ァ-ヶー]+$/.test(c.h);
const escOk=c=>C.esc=="hira"?!isK(c):C.esc=="kata"?isK(c):C.esc=="kanji"?!!c.k:true;
const D=c=>C.esc=="kanji"?c.k:C.esc=="todo"?(c.k||c.h):c.h;
const pool=()=>ALL.filter(c=>C.cats.includes(c.c)&&escOk(c));
const form=(x,c)=>C.esc=="kanji"?!!x.k:C.esc=="todo"?!!x.k==!!c.k:isK(x)==isK(c);
function dis(c,key,extra,n=3){const p=ALL.filter(x=>x!==c&&key(x)!=key(c)&&(!extra||extra(x)));const L=D(c).length,srt=a=>extra?a.sort((a,b)=>Math.abs(D(a).length-L)-Math.abs(D(b).length-L)):a;const r=[...srt(shuf(p.filter(x=>x.c==c.c))),...srt(shuf(p.filter(x=>x.c!=c.c)))],o=[],ks=new Set([key(c)]);for(const x of r){if(!ks.has(key(x))){ks.add(key(x));o.push(x);if(o.length==n)break}}return o}
/* ── Registro de juegos: para añadir uno nuevo, agrega un objeto aquí ── */
const GAMES=[
{id:"flash",ico:"🎴",name:"Flashcards",desc:"Adivina el significado, la escritura o el icono. 7 modos, 3 reglas y contrarreloj opcional.",tag:"Quiz · vidas · sprint",run:()=>setup("flash")},
{id:"memo",ico:"🧩",name:"Parejas",desc:"Voltea cartas y une cada icono con su palabra en el menor número de movimientos.",tag:"Memoria",run:()=>setup("memo")},
{id:"s1",soon:1,ico:"🎧",name:"Dictado",desc:"Escucha y escribe la palabra.",tag:"Próximamente"},
{id:"s2",soon:1,ico:"✍️",name:"Trazos",desc:"Aprende el orden de los trazos.",tag:"Próximamente"}];
const MODES=[["mix","🎲 Mixto"],["ico2es","🖼️ Icono → Español"],["ico2jp","🖼️ Icono → Japonés"],["es2ico","Español → 🖼️ Icono"],["jp2ico","Japonés → 🖼️ Icono"],["jp2es","Japonés → Español"],["ear2ico","🔊 Oído → Icono"]];
const MIX=["ico2es","ico2jp","es2ico","jp2ico","jp2es"];
const RULES=[["clasico","🎯 Clásico","15 rondas: suma el mayor puntaje posible."],["super","❤️ Supervivencia","Tienes 3 vidas. Aguanta tantas tarjetas como puedas."],["sprint","⚡ Sprint","60 segundos en total. Cada fallo resta 3 s."]];
const ESCS=[["todo","Todo"],["hira","ひらがな"],["kata","カタカナ"],["kanji","漢字"]];
let G=null,tm=null;const clr=()=>{clearInterval(tm);tm=null;G=null};
const hearts=n=>"❤️".repeat(n)+"🖤".repeat(3-n);
const chip=(k,v,l,on)=>`<button class="f ${on?"on":""}" data-a="chip" data-k="${k}" data-v="${v}">${l}</button>`;
const tog=(k,l)=>`<button class="f ${C[k]?"on":""}" data-a="tg" data-k="${k}">${l}</button>`;
function stats(){$("st").innerHTML=`<span class="pill">⭐ ${S.xp} XP</span><span class="pill">🃏 ${ALL.length} tarjetas</span><span class="pill">🎯 ${S.seen} jugadas</span>`}
/* ── Inicio ── */
function home(){clr();stats();$("app").innerHTML=`<div class="stats cats">${Object.keys(CT).map(k=>`<span class="pill" style="border-color:${CT[k][1]}">${CT[k][2]} ${CT[k][0]} <b>${ALL.filter(x=>x.c==k).length}</b></span>`).join("")}</div><h2 class="sec">ELIGE UN JUEGO</h2><div class="games">${GAMES.map(g=>`<button class="g" ${g.soon?"disabled":`data-a="game" data-v="${g.id}"`} style="--cc:${g.soon?"var(--mut)":g.id=="memo"?"#2a5d8f":"var(--red)"}" ><span class="gi">${g.ico}</span><b>${g.name}</b><small>${g.desc}</small><i class="tag">${g.tag}</i></button>`).join("")}</div>`}
/* ── Ajustes ── */
function setup(g){clr();C.g=g;const n=pool().length,need=g=="memo"?C.pairs:8;let h=`<div class="panel"><div class="em" style="--cc:var(--red)">${g=="memo"?"🧩":"🎴"}</div><h2>${g=="memo"?"Parejas":"Flashcards"}</h2>`;
if(g=="flash")h+=`<p class="lb">MODO</p><div class="row">${MODES.map(m=>chip("mode",m[0],m[1],C.mode==m[0])).join("")}</div><p class="lb">REGLAS</p><div class="row">${RULES.map(m=>chip("rule",m[0],m[1],C.rule==m[0])).join("")}</div><div class="note">${RULES.find(r=>r[0]==C.rule)[2]}</div>`;
else h+=`<p class="lb">PAREJAS</p><div class="row">${[6,8,10].map(v=>chip("pairs",v,v,C.pairs==v)).join("")}</div><p class="lb">UNIR</p><div class="row">${[["ie","Icono ↔ Español"],["ij","Icono ↔ Japonés"],["mj","Español ↔ Japonés"]].map(v=>chip("ptype",v[0],v[1],C.ptype==v[0])).join("")}</div>`;
h+=`<p class="lb">ESCRITURA</p><div class="row">${ESCS.map(m=>chip("esc",m[0],m[1],C.esc==m[0])).join("")}</div><p class="lb">CATEGORÍAS</p><div class="row cats">${Object.keys(CT).map(k=>`<button class="f ${C.cats.includes(k)?"on":""}" style="--cc:${CT[k][1]}" data-a="cat" data-v="${k}">${CT[k][2]} ${CT[k][0]}</button>`).join("")}<button class="f" data-a="allc">Todas</button></div><p class="lb">EXTRAS</p><div class="row">${g=="flash"?tog("timer","⏱️ Contrarreloj (10 s)")+tog("hint","🖼️ Icono en lectura")+tog("voice","🔊 Voz automática"):""}${tog("ro","Aa Romaji")}</div>
<div class="note">🃏 ${n} tarjetas disponibles${n<need?" · elige más categorías o escrituras":""}</div><div class="acts"><button class="act" data-a="start" ${n<need?"disabled":""}>¡Jugar! 🚀</button><button class="f" data-a="home">← Inicio</button></div></div>`;$("app").innerHTML=h}
/* ── Flashcards ── */
function mk(c,mode){const d=D(c),r=C.ro?`<div class="cnt">${ro(c.h)}</div>`:"",col=CT[c.c][1],ico=`<div class="em big" style="--cc:${col}">${c.e}</div>`,jp=`<div class="jbig jp">${d}</div>${r}`;
const T=(l,f)=>l.map(x=>({v:x.id,h:f(x)})),I=l=>l.map(x=>({v:x.id,h:x.e,i:1})),sh=a=>shuf(a);
const fw=x=>form(x,c);
switch(mode){
case"ico2es":return{p:ico+`<div class="cnt">¿Qué es esto?</div>`,o:sh(T([c,...dis(c,x=>x.m)],x=>x.m))};
case"ico2jp":return{p:ico+`<div class="cnt">¿Cómo se escribe en japonés?</div>`,o:sh(T([c,...dis(c,x=>D(x),fw)],x=>`<span class="jp">${D(x)}</span>${C.ro?`<small>${ro(x.h)}</small>`:""}`))};
case"es2ico":return{p:`<div class="pr">${c.m}</div><div class="cnt">¿Cuál es el icono?</div>`,o:sh(I([c,...dis(c,x=>x.e)]))};
case"jp2ico":return{p:jp+`<div class="cnt">¿Qué icono es?</div>`,o:sh(I([c,...dis(c,x=>x.e)]))};
case"jp2es":return{p:(C.hint?ico:"")+jp+`<div class="cnt">¿Qué significa?</div>`,o:sh(T([c,...dis(c,x=>x.m)],x=>x.m))};
default:return{p:SPEECH?`<button class="sp big" data-a="say" data-v="${c.h}">🔊</button><div class="cnt">¿Qué has oído?</div>`:jp+`<div class="cnt">(sin voz en este navegador) ¿Qué icono es?</div>`,o:sh(I([c,...dis(c,x=>x.e)])),ear:1}}}
function pull(p){if(!G.q.length)G.q=shuf([...p,...p.filter(c=>S.miss[c.id])]);let c=G.q.pop();if(c.id==G.last&&G.q.length){const d=G.q.pop();G.q.push(c);c=d}G.last=c.id;return c}
function startFlash(){const p=pool();G={p,q:[],n:0,total:Math.min(15,p.length),lives:3,score:0,st:0,ms:0,ok:0,miss:[],left:60,busy:true};nextQ();tm=setInterval(tick,100)}
function nextQ(){if(!G)return;const c=pull(G.p),m=C.mode=="mix"?rnd(MIX):C.mode,q=mk(c,m);G.c=c;G.mode=m;G.t0=Date.now();G.busy=false;G.tl=C.timer&&C.rule!="sprint"?10000:0;
const info=C.rule=="clasico"?`${G.n+1} / ${G.total}`:C.rule=="super"?hearts(G.lives):`⏳ <span id="sl">${Math.ceil(G.left)}</span> s`;
$("app").innerHTML=`<div class="panel"><div class="hud"><span>${info}</span><span>🔥 ${G.st}</span><span>⭐ ${G.score}</span></div><div class="tb"><i id="bar"></i></div>${q.p}<div class="og ${q.o[0].i?"ic":""}">${q.o.map(o=>`<button class="o ${o.i?"i":"jp"}" data-a="ans" data-v="${o.v}">${o.h}</button>`).join("")}</div><div class="msg" id="msg"></div><div class="acts"><button class="act" id="nx" data-a="nx" hidden>Siguiente ➜</button><button class="f" data-a="home">✕ Salir</button></div></div>`;
if(q.ear||C.voice&&m!="es2ico"&&m!="ico2es"&&m!="ico2jp")say(c.h)}
function tick(){if(!G||!G.c)return;const b=$("bar");if(C.rule=="sprint"){G.left-=.1;const s=$("sl");if(s)s.textContent=Math.max(0,Math.ceil(G.left));if(b){b.style.width=Math.max(0,G.left/60*100)+"%";b.className=G.left<10?"lo":""}if(G.left<=0)return end()}else if(G.tl&&!G.busy){const e=Date.now()-G.t0;if(b){b.style.width=Math.max(0,100-e/G.tl*100)+"%";b.className=e>G.tl*.7?"lo":""}if(e>=G.tl)ans(null)}}
function ans(v){if(!G||G.busy)return;G.busy=true;const c=G.c,ok=v==c.id,el=Date.now()-G.t0;
document.querySelectorAll(".o").forEach(b=>{b.disabled=true;if(b.dataset.v==c.id)b.classList.add("ok");else if(b.dataset.v==v)b.classList.add("bad")});
G.n++;if(ok){G.ok++;G.st++;G.ms=Math.max(G.ms,G.st);G.score+=10+Math.min(G.st,5)*2+(G.tl?Math.round(5*(1-el/G.tl)):0);if(S.miss[c.id]&&!--S.miss[c.id])delete S.miss[c.id]}
else{G.st=0;G.miss.push(c);S.miss[c.id]=(S.miss[c.id]||0)+1;if(C.rule=="super")G.lives--;if(C.rule=="sprint")G.left-=3}
const rv=`${c.e} <span class="jp">${D(c)}</span> <small>(${ro(c.h)})</small> = ${c.m} <button class="sp" data-a="say" data-v="${c.h}">🔊</button>`;
$("msg").innerHTML=ok?`✔ ¡Correcto! <small>${rv}</small>`:`${v==null?"⏰ ¡Tiempo!":"✖"} <small>${rv}</small>`;
const over=C.rule=="clasico"?G.n>=G.total:C.rule=="super"?G.lives<=0:G.left<=0;
if(over)return setTimeout(end,ok?900:1800);
if(ok||C.rule=="sprint")setTimeout(nextQ,ok?750:1400);else{$("nx").hidden=false}}
function rank(r){return r>=.9?["🏆","¡Maestro!"]:r>=.7?["👏","¡Muy bien!"]:r>=.4?["💪","Vas por buen camino"]:["🌱","¡A practicar!"]}
function end(){if(!G)return;clearInterval(tm);const acc=G.n?Math.round(G.ok/G.n*100):0,key=C.rule+(C.timer&&C.rule!="sprint"?"+t":""),nb=G.score>(S.best[key]||0),rk=rank(acc/100);if(nb)S.best[key]=G.score;S.xp+=G.score;S.seen++;save();
$("app").innerHTML=`<div class="panel"><div class="em big" style="--cc:var(--red)">${rk[0]}</div><h2>${rk[1]}</h2><p>Puntaje <b>${G.score}</b> · Aciertos ${G.ok}/${G.n} (${acc}%) · Racha máx. 🔥${G.ms}</p><p class="cnt">${nb?"🎉 ¡Nuevo récord!":"Récord: "+S.best[key]} · +${G.score} XP</p>${G.miss.length?`<p class="lb">PARA REPASAR</p><div class="ml">${[...new Map(G.miss.map(c=>[c.id,c])).values()].map(c=>`<div>${c.e} <b class="jp">${D(c)}</b> <small>(${ro(c.h)})</small> — ${c.m}</div>`).join("")}</div>`:""}<div class="acts"><button class="act" data-a="start">Jugar otra vez</button><button class="f" data-a="set">⚙️ Ajustes</button><button class="f" data-a="home">Inicio</button></div></div>`;G=null}
/* ── Parejas ── */
const fmt=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
function startMemo(){const p=shuf(pool()).slice(0,C.pairs),[a,b]={ie:["e","m"],ij:["e","j"],mj:["m","j"]}[C.ptype];
const f=(c,s)=>({pid:c.id,h:s=="e"?`<span class="mce">${c.e}</span>`:s=="m"?`<span>${c.m}</span>`:`<span class="mcj jp">${D(c)}</span>${C.ro?`<small>${ro(c.h)}</small>`:""}`});
G={cells:shuf(p.flatMap(c=>[f(c,a),f(c,b)])),open:[],done:0,moves:0,t0:Date.now(),lock:false,total:p.length};
const cols=C.pairs==10?5:4;$("app").innerHTML=`<div class="panel"><div class="hud"><span>🔁 <span id="mv">0</span></span><span>⏱️ <span id="mt">0:00</span></span><span>✔ <span id="md">0</span>/${p.length}</span></div><div class="mg" style="grid-template-columns:repeat(${cols},1fr)">${G.cells.map((x,i)=>`<div class="mc" data-a="flip" data-v="${i}"><div class="in"><div class="s mf">遊</div><div class="s mb jp">${x.h}</div></div></div>`).join("")}</div><div class="acts"><button class="f" data-a="home">✕ Salir</button></div></div>`;
tm=setInterval(()=>{const e=$("mt");if(e&&G)e.textContent=fmt(Date.now()-G.t0)},500)}
function flip(i){if(!G||G.lock)return;const el=document.querySelector(`.mc[data-v="${i}"]`);if(el.classList.contains("fl"))return;el.classList.add("fl");G.open.push(i);if(G.open.length<2)return;G.moves++;$("mv").textContent=G.moves;const[x,y]=G.open,ex=document.querySelector(`.mc[data-v="${x}"]`);G.open=[];
if(G.cells[x].pid==G.cells[y].pid){G.done++;$("md").textContent=G.done;setTimeout(()=>{ex.classList.add("ok");el.classList.add("ok")},450);if(G.done==G.total)setTimeout(endMemo,1100)}
else{G.lock=true;setTimeout(()=>{ex.classList.remove("fl");el.classList.remove("fl");if(G)G.lock=false},950)}}
function endMemo(){if(!G)return;clearInterval(tm);const t=Date.now()-G.t0,key="memo"+C.pairs,b=S.best[key],nb=!b||G.moves<b,xp=Math.max(10,G.total*8-G.moves*2+20),st=G.moves<=G.total*1.5?3:G.moves<=G.total*2.2?2:1;if(nb)S.best[key]=G.moves;S.xp+=xp;S.seen++;save();
$("app").innerHTML=`<div class="panel"><div class="em big" style="--cc:var(--red)">${"⭐".repeat(st)}</div><h2>¡Completado!</h2><p>${G.moves} movimientos · ${fmt(t)}</p><p class="cnt">${nb?"🎉 ¡Nuevo récord!":"Mejor: "+S.best[key]+" movimientos"} · +${xp} XP</p><div class="acts"><button class="act" data-a="start">Otra vez</button><button class="f" data-a="set">⚙️ Ajustes</button><button class="f" data-a="home">Inicio</button></div></div>`;G=null}
/* ── Eventos ── */
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,v=t.dataset.v,k=t.dataset.k;
if(a=="game")GAMES.find(g=>g.id==v).run();
else if(a=="chip"){C[k]=isNaN(v)?v:+v;setup(C.g)}
else if(a=="tg"){C[k]=!C[k];setup(C.g)}
else if(a=="cat"){const i=C.cats.indexOf(v);if(i<0)C.cats.push(v);else if(C.cats.length>1)C.cats.splice(i,1);setup(C.g)}
else if(a=="allc"){C.cats=Object.keys(CT);setup(C.g)}
else if(a=="start")C.g=="memo"?(clr(),startMemo()):(clr(),startFlash());
else if(a=="set")setup(C.g);
else if(a=="home"){home()}
else if(a=="ans")ans(v);
else if(a=="nx")nextQ();
else if(a=="say")say(v);
else if(a=="flip")flip(+v)});
$("sun").onclick=()=>{const dk=document.documentElement.dataset.theme?document.documentElement.dataset.theme=="dark":matchMedia("(prefers-color-scheme:dark)").matches;S.theme=dk?"light":"dark";theme();save()};
home();
</script></body></html>
