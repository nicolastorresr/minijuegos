<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>遊び · Minijuegos de japonés</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f1e3;--card:#fffaf0;--ink:#2b2220;--red:#c1272d;--mut:#7a6a5f;--ok:#2e7d4f;--bad:#b3261e;--line:#e3d6bd;--blue:#2a5d8f;--sh:#2b22201f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1716;--card:#2a2120;--ink:#f3e9d8;--mut:#b5a595;--line:#43352f;--red:#e0545a;--blue:#7fb2e5;--sh:#0008}}
:root[data-theme="dark"]{--bg:#1d1716;--card:#2a2120;--ink:#f3e9d8;--mut:#b5a595;--line:#43352f;--red:#e0545a;--blue:#7fb2e5;--sh:#0008}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;background-image:radial-gradient(circle at 100% 100%,transparent 55%,var(--line) 56%,var(--line) 58%,transparent 59%),radial-gradient(circle at 0 100%,transparent 55%,var(--line) 56%,var(--line) 58%,transparent 59%);background-size:44px 22px;background-attachment:fixed}
header{text-align:center;padding:30px 16px 6px}
.sun{width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ef5b5f,var(--red));margin:0 auto 10px;display:grid;place-items:center;color:#fff;font-size:36px;font-weight:700;box-shadow:0 6px 18px #c1272d55;animation:fl 4s ease-in-out infinite;cursor:pointer}
@keyframes fl{50%{transform:translateY(-5px)}}
h1{margin:0;font-size:1.9rem;letter-spacing:.15em}header p{margin:4px 0 8px;color:var(--mut)}
h2{margin:6px 0}.sec{text-align:center;letter-spacing:.1em;margin:18px 0 6px}
.stats,.row,.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.85rem;box-shadow:0 2px 6px var(--sh)}
button{font:inherit;color:inherit;cursor:pointer}
.f{border:1.5px solid var(--red);background:var(--card);color:var(--red);padding:7px 14px;border-radius:999px;transition:.15s}
.f:hover{transform:translateY(-2px)}.f.on{background:var(--red);color:#fff}
.act{border:0;background:linear-gradient(135deg,#d93a40,#a81e24);color:#fff;padding:11px 22px;border-radius:12px;font-weight:700;box-shadow:0 4px 12px #c1272d44}
.act:hover:not(:disabled){filter:brightness(1.1)}.act:disabled{opacity:.45;cursor:not-allowed}
.act.alt{background:linear-gradient(135deg,#2a5d8f,#1c3f66);box-shadow:0 4px 12px #2a5d8f44}
#app{max-width:960px;margin:0 auto;padding:6px 14px 50px}
.cnt{text-align:center;color:var(--mut);font-size:.9rem;margin:4px 0}
.jp{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--blue);color:var(--blue);border-radius:999px;padding:1px 8px;font-style:normal}
.lb{font-size:.7rem;color:var(--red);font-weight:700;letter-spacing:.08em;margin:14px 0 6px;text-align:center}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:10px}
.g{--cc:var(--red);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:22px 16px;background:linear-gradient(180deg,color-mix(in srgb,var(--cc) 12%,var(--card)),var(--card) 55%);border:1px solid var(--line);border-top:5px solid var(--cc);border-radius:14px;box-shadow:0 6px 16px var(--sh);transition:.2s}
.g:hover:not(:disabled){transform:translateY(-5px) rotate(-.4deg)}.g b{font-size:1.3rem;letter-spacing:.06em}.g small{color:var(--mut);font-size:.9rem;line-height:1.35}
.g.soon{opacity:.55;cursor:default;border-style:dashed}
.gi{font-size:2.6rem;width:84px;height:84px;display:grid;place-items:center;border-radius:50%;background:color-mix(in srgb,var(--cc) 18%,var(--card));box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--cc) 40%,transparent)}
.panel{max-width:600px;margin:14px auto;padding:22px 16px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px var(--sh)}
.em{--cc:var(--red);font-size:3.4rem;width:96px;height:96px;display:grid;place-items:center;border-radius:50%;background:color-mix(in srgb,var(--cc) 18%,var(--card));box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--cc) 40%,transparent);margin:0 auto 6px}
.em.big{font-size:4.6rem;width:128px;height:128px}
.jbig{font-size:3.4rem;line-height:1.25;color:var(--red);margin:6px 0}
.pr{font-size:1.7rem;margin:10px 0}
.hud{display:flex;justify-content:space-between;gap:8px;font-weight:700;margin-bottom:8px}
.tb{height:9px;border-radius:9px;background:var(--line);overflow:hidden;margin-bottom:10px}
.tb i{display:block;height:100%;width:100%;background:var(--ok);transition:width .1s linear}
.tb i.lo{background:var(--bad)}
.og{display:grid;gap:8px;margin:10px 0}.og.ic{grid-template-columns:1fr 1fr}
.o{display:block;width:100%;padding:11px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:1.15rem;transition:.15s}
.o small{display:block;font-size:.72rem;opacity:.7}
.o.i{font-size:3.2rem;line-height:1.1;padding:12px 0}
.o:hover:not(:disabled){border-color:var(--red);transform:scale(1.02)}
.o.ok{background:var(--ok);color:#fff;border-color:var(--ok);animation:pop .4s}.o.bad{background:var(--bad);color:#fff;border-color:var(--bad);animation:sk .35s}
@keyframes pop{50%{transform:scale(1.07)}}@keyframes sk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.msg{min-height:34px;font-weight:700;margin:6px 0}.msg small{font-weight:400;color:var(--mut)}
.sp{border:0;background:transparent;font-size:1.2rem;line-height:1}
.sp.big{font-size:3rem;width:110px;height:110px;border-radius:50%;background:color-mix(in srgb,var(--blue) 15%,var(--card));box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--blue) 40%,transparent)}
.note{color:var(--mut);font-size:.85rem;min-height:20px;margin:8px 0}
.cats .f{--cc:var(--red);border-color:var(--cc);color:var(--cc);font-size:.85rem;padding:5px 11px}.cats .f.on{background:var(--cc);color:#fff}
.ml{text-align:left;max-height:190px;overflow:auto;margin:10px 0;border-top:1px solid var(--line)}
.ml div{padding:5px 4px;border-bottom:1px solid var(--line);font-size:.95rem}
.mg{display:grid;gap:8px;margin:10px 0}
.mc{perspective:700px;aspect-ratio:3/4;cursor:pointer}
.in{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.mc.fl .in{transform:rotateY(180deg)}
.s{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);border-radius:10px;box-shadow:0 3px 8px var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px;overflow:hidden;line-height:1.15}
.mf{background:linear-gradient(135deg,#d93a40,#a81e24);color:#fff;font-size:1.8rem;border-top:4px solid #f4b942}
.mb{background:var(--card);transform:rotateY(180deg);font-size:.85rem}
.mc.ok .mb{background:color-mix(in srgb,var(--ok) 25%,var(--card));border-color:var(--ok)}.mc.ok{animation:pop .5s}
.mce{font-size:2.3rem}.mcj{font-size:1.2rem}.mb small{font-size:.65rem;color:var(--mut)}
.tray{min-height:64px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;padding:10px;margin-top:12px;border:2px dashed var(--line);border-radius:12px;background:color-mix(in srgb,var(--bg) 70%,var(--card))}
.tray:empty::before{content:"Toca los bloques para construir la frase";color:var(--mut);font-size:.85rem}
.bank{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:14px 0}
.bk{border:1.5px solid var(--line);border-bottom-width:4px;border-radius:9px;background:var(--bg);color:var(--ink);padding:7px 11px;font-size:1.1rem;line-height:1.2;transition:.12s}
.bk small{display:block;font-size:.65rem;color:var(--mut)}
.bk:hover:not(:disabled){border-color:var(--red);transform:translateY(-2px)}
.bk.used{opacity:.2;cursor:default}
.tray .bk{background:var(--card);border-color:var(--blue)}
.tray .bk.ok,.bk.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.bk.ok small,.bk.bad small{color:#ffffffcc}
.tray .bk.bad{background:var(--bad);color:#fff;border-color:var(--bad);animation:sk .35s}
.jbig.sm{font-size:2rem}.f.sm{font-size:.8rem;padding:4px 12px}.f.sm b{font-weight:400}
.msg .jp{font-size:1.2rem}
[hidden]{display:none!important}
</style></head><body>

function bestV(q,by){const t=q.pl.map(id=>qb(id).t);let bv=q.vs[0],bp=-1,bm=-1,bk=-1;for(const v of q.vs){let p=0;while(p<t.length&&p<v.length&&v[p].t==t[p])p++;let m=0;t.forEach((x,i)=>{if(v[i]&&v[i].t==x)m++});const k=by=="p"?p*1000+m:m*1000+p;if(k>bk){bk=k;bv=v;bp=p}}return{t,v:bv,p:bp}}
function hintFr(){if(G.busy)return;const q=G.q,{v,p}=bestV(q,"p");q.pl=q.pl.slice(0,p);if(p<v.length){const b=q.bl.find(b=>b.t==v[p].t&&!q.pl.includes(b.id));if(b){q.pl.push(b.id);G.hints++}}G.mark=[];paint()}
function chkFr(){if(!G||G.busy||!G.q.pl.length)return;const q=G.q,t=q.pl.map(id=>qb(id).t);if(q.acc.has(t.join("\u0001")))return finS(true);G.att++;if(G.att>=2)return finS(false);const{v}=bestV(q,"m");G.mark=t.map((x,i)=>v[i]&&v[i].t==x?"":"bad");paint();$("msg").innerHTML=G.mark.includes("bad")?`🤔 Casi… los bloques en rojo no están en su sitio. <small>(un intento más)</small>`:`🤔 Aún faltan bloques. <small>(un intento más)</small>`}
const REG={c:"🎩 Estilo cortés (です・ます)",n:"👕 Estilo llano (forma de diccionario)",cn:"🎩👕 Vale cortés o llano"};
function finS(ok){G.busy=true;const s=G.c,q=G.q,es=q.dir=="es2jp";G.n++;let pts=0;
if(ok){G.ok++;G.st++;G.ms=Math.max(G.ms,G.st);pts=Math.max(5,Math.round((15+5*s.lv+Math.min(G.st,5)*2)*(G.att?.5:1))-G.hints*4);G.score+=pts}else{G.st=0;G.miss.push(s);if(C.frule=="super")G.lives--}
const{v}=bestV(q,"m");G.mark=q.pl.map((id,i)=>ok||(v[i]&&v[i].t==qb(id).t)?"ok":"bad");paint();
const al=es?s.alts:s.ealts,fr=es?s.jfree:s.efree,ex=[];if(al.length)ex.push("↔ También vale: "+al.slice(0,2).map(a=>`<span class="${es?"jp":""}">${a}</span>`).join(" · "));if(fr)ex.push("↔ El orden de los complementos puede variar");
const rv=`${s.es}<br><span class="jp">${jpFull(s)}</span> <button class="sp" data-a="say" data-v="${s.jp.map(b=>b.r||b.t).join("")}">🔊</button>${C.ro?`<br>${s.jp.map(rb).join(" ")}`:""}`;
$("msg").innerHTML=`${ok?`✔ ¡Perfecto! +${pts}`:G.tout?"⏰ ¡Tiempo!":"✖ Esta era la solución"}<br><small>${rv}${ex.length?"<br>"+ex.join("<br>"):""}<br>${REG[s.reg]} · 📘 ${s.tag}</small>`;
$("fa").hidden=true;G.over=C.frule=="clasico"?G.n>=G.total:G.lives<=0;const f=$("fn");f.textContent=G.over?"Ver resultado ➜":"Siguiente ➜";f.hidden=false}
function endFr(){if(!G)return;clearInterval(tm);const acc=G.n?Math.round(G.ok/G.n*100):0,key="fr"+C.frule,nb=G.score>(S.best[key]||0),rk=rank(acc/100);if(nb)S.best[key]=G.score;S.xp+=G.score;S.seen++;save();
$("app").innerHTML=`<div class="panel"><div class="em big" style="--cc:var(--red)">${rk[0]}</div><h2>${rk[1]}</h2><p>Puntaje <b>${G.score}</b> · Frases ${G.ok}/${G.n} (${acc}%) · Racha máx. 🔥${G.ms}</p><p class="cnt">${nb?"🎉 ¡Nuevo récord!":"Récord: "+S.best[key]} · +${G.score} XP</p>${G.miss.length?`<p class="lb">PARA REPASAR</p><div class="ml">${G.miss.map(s=>`<div>${s.es}<br><b class="jp">${jpFull(s)}</b> <small>📘 ${s.tag}</small></div>`).join("")}</div>`:""}<div class="acts"><button class="act" data-a="start">Jugar otra vez</button><button class="f" data-a="set">⚙️ Ajustes</button><button class="f" data-a="home">Inicio</button></div></div>`;G=null}
function setupFr(){const L=[[0,"Todos"],[1,"🌱 Básico"],[2,"🌿 Intermedio"],[3,"🌳 Avanzado"]],n=SENT.filter(s=>!C.lvl||s.lv==C.lvl).length;
$("app").innerHTML=`<div class="panel"><div class="em" style="--cc:#2a5d8f">🧱</div><h2>Oraciones</h2><p class="cnt">Construye la frase con bloques de ひらがな, カタカナ y 漢字.</p><p class="lb">DIRECCIÓN</p><div class="row">${[["mix","🎲 Mixta"],["es2jp","Español → 日本語"],["jp2es","日本語 → Español"]].map(v=>chip("dir",v[0],v[1],C.dir==v[0])).join("")}</div><p class="lb">NIVEL</p><div class="row">${L.map(v=>chip("lvl",v[0],v[1],C.lvl==v[0])).join("")}</div><p class="lb">REGLAS</p><div class="row">${[["clasico","🎯 10 frases"],["super","❤️ Supervivencia (3 vidas)"]].map(v=>chip("frule",v[0],v[1],C.frule==v[0])).join("")}</div><p class="lb">EXTRAS</p><div class="row">${tog("ro","Aa Romaji")}${tog("traps","🪤 Bloques trampa")}${tog("ftimer","⏱️ Contrarreloj (60 s)")}</div><div class="note">📚 ${n} frases · se aceptan todas las variantes válidas</div><div class="acts"><button class="act" data-a="start">¡Construir! 🧱</button><button class="f" data-a="home">← Inicio</button></div></div>`}
/* ── Eventos ── */
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,v=t.dataset.v,k=t.dataset.k;
if(a=="game")GAMES.find(g=>g.id==v).run();
else if(a=="chip"){C[k]=isNaN(v)?v:+v;setup(C.g)}
else if(a=="tg"){C[k]=!C[k];setup(C.g)}
else if(a=="cat"){const i=C.cats.indexOf(v);if(i<0)C.cats.push(v);else if(C.cats.length>1)C.cats.splice(i,1);setup(C.g)}
else if(a=="allc"){C.cats=Object.keys(CT);setup(C.g)}
else if(a=="start"){clr();C.g=="memo"?startMemo():C.g=="frase"?startFr():startFlash()}
else if(a=="bp"){if(G&&!G.busy){G.q.pl.push(+v);G.mark=[];paint()}}
else if(a=="bt"){if(G&&!G.busy){G.q.pl.splice(+v,1);G.mark=[];paint()}}
else if(a=="rs"){if(G&&!G.busy){G.q.pl=[];G.mark=[];paint();$("msg").innerHTML=""}}
else if(a=="chk")chkFr();
else if(a=="hint")hintFr();
else if(a=="fnx"){if(G.over)endFr();else nextS()}
else if(a=="tgc"){const p=$("cp");p.hidden=!p.hidden;e.target.closest("[data-a]").querySelector("b").textContent=p.hidden?"▾":"▴"}
else if(a=="set")setup(C.g);
else if(a=="home"){home()}
else if(a=="ans")ans(v);
else if(a=="nx")nextQ();
else if(a=="say")say(v);
else if(a=="flip")flip(+v)});
$("sun").onclick=()=>{const dk=document.documentElement.dataset.theme?document.documentElement.dataset.theme=="dark":matchMedia("(prefers-color-scheme:dark)").matches;S.theme=dk?"light":"dark";theme();save()};
home();
</script></body></html>
